<meta name="apple-mobile-web-app-title" content="Chi Tiêu Nhà">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}

<body>
<title>Chi Tiêu Nhà Chung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header + one scrolling column (max 560px) + fixed bottom tab bar. */
:root{
  --bg:#F6F8F5; --surface:#FFFFFF; --surface-2:#EDF1EC; --line:#DDE4DC;
  --fg:#141B17; --muted:#5D6B62;
  --accent:#0E6A54; --accent-ink:#0A4F3F; --accent-soft:#D8EDE4;
  --warn:#A8521B; --warn-soft:#F6E6D7;
  --c1:#0E6A54; --c2:#C87A2B; --c3:#5B5BD6; --c4:#B0426A; --c5:#2A7FA8; --c6:#6F8B1E;
  --font-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:14px;
  --shadow:0 1px 2px rgba(20,27,23,.05), 0 8px 24px -16px rgba(20,27,23,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411; --surface:#151F1A; --surface-2:#1C2822; --line:#27352E;
    --fg:#E7EFEA; --muted:#93A59A; --accent:#4FD1A5; --accent-ink:#9CE9CD; --accent-soft:#143328;
    --warn:#E79A61; --warn-soft:#33241A;
    --c1:#4FD1A5; --c2:#E0A75E; --c3:#9A9AF0; --c4:#EC88AC; --c5:#6BBDE2; --c6:#B7D44A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1A; --surface-2:#1C2822; --line:#27352E;
  --fg:#E7EFEA; --muted:#93A59A; --accent:#4FD1A5; --accent-ink:#9CE9CD; --accent-soft:#143328;
  --warn:#E79A61; --warn-soft:#33241A;
  --c1:#4FD1A5; --c2:#E0A75E; --c3:#9A9AF0; --c4:#EC88AC; --c5:#6BBDE2; --c6:#B7D44A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-inline:16px}
.app{min-height:100%;display:flex;flex-direction:column}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.brand .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{flex:none;display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted)}
.src.live{background:var(--accent-soft);color:var(--accent-ink)}
.src i{width:5px;height:5px;border-radius:99px;background:currentColor;flex:none}
.iconbtn{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.iconbtn:active{transform:scale(.95)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

main{flex:1;padding-block:16px 104px}
section{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent;border:0;padding:0}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.ttl h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ttl em{font-style:normal;font-size:12px;color:var(--muted);font-family:var(--font-num)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.hero .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero .big{font-family:var(--font-num);font-weight:600;font-size:clamp(28px,9vw,38px);letter-spacing:-.02em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.hero .sub{margin-top:6px;font-size:13px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.statgrid div{min-width:0}
.statgrid .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.statgrid .v{font-family:var(--font-num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bars{display:flex;flex-direction:column;gap:11px}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:5px}
.bar .top b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .top span{font-family:var(--font-num);font-variant-numeric:tabular-nums;flex:none;font-size:13px}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.col .v{font-family:var(--font-num);font-size:10px;color:var(--muted);white-space:nowrap}
.col .b{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.col.zero .b{background:var(--surface-2)}
.col .d{font-size:10.5px;color:var(--muted);white-space:nowrap}

.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut svg{flex:none;width:118px;height:118px}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span{font-family:var(--font-num);font-size:12.5px;color:var(--muted);flex:none}

.rows{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .nm{font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.row .me{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;white-space:nowrap;flex:none;padding-top:1px}
.dot{width:7px;height:7px;border-radius:99px;flex:none;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;background:var(--surface-2);font-size:11px;color:var(--muted);font-weight:500;border:0;font-family:inherit}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--accent-soft);color:var(--accent-ink)}

.me.calc{font-family:var(--font-num);font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:4px}
.sub2{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--fg);margin:2px 0 4px}
.dayitem{padding:11px 0;border-top:1px solid var(--line)}
.dayitem:first-child{border-top:0;padding-top:0}
.dayitem .head{display:flex;gap:10px;align-items:flex-start}
.dayitem .head .main{flex:1;min-width:0}
.ck{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.ck b{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ck span{min-width:0;overflow-wrap:anywhere;color:var(--accent-ink);font-weight:500}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dayhead b{font-size:13px;font-weight:700;letter-spacing:.03em}
.dayhead span{font-family:var(--font-num);font-size:12.5px;color:var(--muted)}

.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
:root[data-theme="dark"] .pill[aria-pressed="true"],:root[data-theme="dark"] .btn.pri{color:#07140F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill[aria-pressed="true"],:root:not([data-theme="light"]) .btn.pri{color:#07140F}}
input[type="search"],input[type="text"]{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:inherit;font-size:15px}
input:focus-visible,button:focus-visible,a:focus-visible,[role="radio"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.scroll{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0;border-top:2px solid var(--line)}
td.zero{color:var(--muted);opacity:.5}

.opt{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.opt:first-of-type{border-top:0}
.opt .rd{width:19px;height:19px;border-radius:99px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .rd{border-color:var(--accent)}
.opt[aria-checked="true"] .rd:after{content:"";width:9px;height:9px;border-radius:99px;background:var(--accent)}
.opt .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
a{color:var(--accent-ink)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:flex;gap:2px;padding-block:6px}
.tab{flex:1;min-width:0;background:none;border:0;padding:6px 1px;border-radius:11px;color:var(--muted);font-family:inherit;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;white-space:nowrap}
@media (max-width:380px){.tab{font-size:9px}}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}

.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.err{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:14px;font-size:13.5px}
.sk{background:var(--surface-2);border-radius:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.diff{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:9px 11px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
</style>

<div class="app">
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <b id="shName">Đang tải…</b>
        <div class="meta"><span id="shMeta">Chi Phí Nhà Hàng Tháng</span><span class="src" id="srcChip"><i></i>…</span></div>
      </div>
      <button class="iconbtn" id="btnTheme" title="Đổi nền sáng/tối" aria-label="Đổi nền sáng tối">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </button>
      <button class="iconbtn" id="btnReload" title="Tải lại dữ liệu" aria-label="Tải lại dữ liệu">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      </button>
    </div>
  </header>

  <main><div class="wrap"><div id="view"></div></div></main>

  <nav class="tabbar"><div class="wrap">
    <button class="tab" data-tab="overview" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M3 13h5v8H3zM9.5 3h5v18h-5zM16 9h5v12h-5z"></path></svg>Tổng quan</button>
    <button class="tab" data-tab="list" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>Giao dịch</button>
    <button class="tab" data-tab="pay" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M17 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3z"></path><path d="M8 10h8M8 14h5"></path></svg>Thanh toán</button>
    <button class="tab" data-tab="stats" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9v9z"></path><path d="M15.5 3.5A9 9 0 0 1 20.5 8.5L12 12z"></path></svg>Thống kê</button>
    <button class="tab" data-tab="sheets" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 9v12"></path></svg>Sheet</button>
  </div></nav>
</div>

      var c = r.c && r.c[i];

      if(typeof c.v === "string" && /^Date\(/.test(c.v)){
        var m = /^Date\((\d+),(\d+),(\d+)/.exec(c.v);
        row.push({ t:"d", v: new Date(+m[1], +m[2], +m[3]).getTime(), f: c.f || "" });
      }else if(typeof c.v === "number"){
        row.push({ t:"n", v: c.v, f: c.f || String(c.v) });
      }else{
        var s = String(c.f != null ? c.f : c.v).trim();
        row.push(s ? { t:"s", f:s } : null);
      }
    }
    while(row.length && !row[row.length-1]) row.pop();
    return row;
  });
}

/* ---------- gọi Google Sheet qua JSONP ---------- */
var seq = 0;
/* headers: bỏ trống = 0 (giữ mọi hàng), "auto" = để Google tự gộp tiêu đề,
   hoặc một con số = gộp đúng bấy nhiêu hàng đầu */
function gviz(sheet, timeout, headers){
  return new Promise(function(resolve, reject){
    var cb = "__gv" + (++seq) + "_" + (Date.now() % 100000);
    var s = document.createElement("script"), done = false;
    var t = setTimeout(function(){ finish(); reject(new Error("timeout")); }, timeout || 9000);
    function finish(){
      if(done) return; done = true;
      clearTimeout(t);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = function(res){ finish(); resolve(res); };
    s.onerror = function(){ finish(); reject(new Error("blocked")); };
    /* headers=0 giữ nguyên mọi hàng, nhưng Google ép kiểu từng cột nên chữ nằm
       trong cột số bị trả về rỗng — mất hết tên người. Gọi thêm lần nữa không
       kèm headers=0 thì tiêu đề được gộp vào cols[].label, lấy lại được tên. */
    var hp = headers === "auto" ? "" :
             (headers == null ? "&headers=0" : "&headers=" + headers);
    s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?sheet=" +
            encodeURIComponent(sheet) + "&tqx=out:json;responseHandler:" + cb +
            hp + "&_=" + Date.now();
    document.head.appendChild(s);
  });
}

/* ---------- đọc bảng mua hàng theo tuần ---------- */
function parseLedger(g, labels){
  var hr = -1, bc = -1, r, c, W = width(g);
  for(r = 0; r < Math.min(g.length, 16) && hr < 0; r++){
    for(c = 0; c < (g[r] || []).length; c++){
      var t = txt(g[r][c]).toLowerCase();
      if(t.length < 22 && /ng(u|ư)[oờ]i\s*mua/.test(t)){ hr = r; bc = c; break; }
    }
  }
  if(hr < 0) return null;

  /* Chỉ xét vùng cột của bảng mua hàng; xa hơn là bảng chia tiền bên phải. */
  var LAST = Math.min(bc + 6, W - 1);
  var col = { item: bc+1, qty: bc+2, amount: bc+3, leftQty: bc+4, date: bc+5, leftVal: bc+6 };
  var namedDate = -1;
  for(c = bc + 1; c <= LAST; c++){
    var h = txt(cell(g, hr, c)).toLowerCase();
    if(/^m[oô]\s*t[aả]/.test(h)) col.item = c;
    else if(/^sl$|s[oố]\s*l[uư][oợ]ng/.test(h)) col.qty = c;
    else if(/s[oố]\s*ti[eề]n|th[aà]nh\s*ti[eề]n|gi[aá]/.test(h)) col.amount = c;
    else if(/d[uư]\s*l[aạ]i/.test(h)) col.leftQty = c;
    else if(/^ng[aà]y/.test(h) && namedDate < 0){ namedDate = c; col.date = c; }
  }
  if(namedDate < 0){
    var dateScore = 0;
    for(c = bc + 1; c <= LAST; c++){
      var k = 0;
      for(r = hr + 1; r < g.length; r++){ if(pdate(cell(g, r, c))) k++; }
      if(k > dateScore && k >= 2){ dateScore = k; col.date = c; }
    }
  }
  if(col.amount >= col.date){
    for(c = bc + 1; c < col.date; c++){
      var hits = 0;
      for(r = hr + 1; r < g.length; r++){ var cl = cell(g, r, c); if(cl && cl.t === "n") hits++; }
      if(hits){ col.amount = c; break; }
    }
  }
  col.leftVal = col.date + 1;

  var items = [];
  for(r = hr + 1; r < g.length; r++){
    var buyer = txt(cell(g, r, bc)), name = txt(cell(g, r, col.item));
    if(!buyer && !name) continue;
    if(/^t[oổ]ng/i.test(name)) continue;
    items.push({
      buyer: buyer || "Chưa rõ",
      name: name || "(chưa đặt tên)",
      qty: txt(cell(g, r, col.qty)),
      amount: num(cell(g, r, col.amount)),
      date: pdate(cell(g, r, col.date)),
      leftQty: txt(cell(g, r, col.leftQty)),
      leftVal: num(cell(g, r, col.leftVal))
    });
  }

  var sp = parseSplit(g, col.date + 1, labels);
  return { kind:"ledger", items: items, days: sp ? sp.days : [], people: sp ? sp.people : [] };
}

/* Bỏ đuôi số/tiền mà Google gộp thêm vào nhãn cột: "Chị La 47.333 đ" -> "Chị La" */
function cleanLabel(s){
  s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  var prev;
  do{
    prev = s;
    s = s.replace(/[\s,;|·-]*\d[\d.,]*\s*(đ|vnd|d)?\s*$/i, "").trim();
  }while(s !== prev && s);
  return s;
}
function isDayCell(c){
  if(!c) return false;
  if(c.t === "d") return true;
  return /^\d{1,2}\s*[./-]\s*\d{1,2}$/.test(txt(c));
}

/* Khối chia tiền bên phải. Nhận dạng theo cấu trúc chứ không dựa vào chữ tiêu đề:
   đọc trực tiếp từ Google, mọi tiêu đề nằm trong cột kiểu số đều bị trả về rỗng. */
function parseSplit(g, startCol, labels){
  var W = width(g), r, c, i;

  var dayCol = -1, best = 1;
  for(c = startCol; c < W; c++){
    var k = 0;
    for(r = 0; r < g.length; r++){ if(isDayCell(cell(g, r, c))) k++; }
    if(k > best){ best = k; dayCol = c; }
  }
  if(dayCol < 0) return null;

  var rows = [];
  for(r = 0; r < g.length; r++){
    var dc = cell(g, r, dayCol);
    if(!isDayCell(dc)) continue;
    var dd = pdate(dc);
    rows.push({ row: r, label: dd ? dshort(dd) : txt(dc) });
  }
  if(!rows.length) return null;

  /* các cột số liền nhau ngay sau cột ngày */
  var vals = [];
  for(c = dayCol + 1; c < W; c++){
    var hits = 0;
    for(i = 0; i < rows.length; i++){
      var x = cell(g, rows[i].row, c);
      if(x && x.t === "n") hits++;
    }
    if(!hits) break;
    vals.push(c);
  }
  if(vals.length < 2) return null;

  /* tên cột: chữ trong lưới nếu có, không thì lấy từ nhãn cột Google trả về */
  var hr = -1;
  for(r = 0; r < Math.min(g.length, 16) && hr < 0; r++){
    if(/^ng[aà]y$/i.test(txt(cell(g, r, dayCol)))) hr = r;
  }
  function nameOf(cc){
    var nm = hr >= 0 ? txt(cell(g, hr, cc)) : "";
    if(!nm && labels) nm = cleanLabel(labels[cc]);
    return nm;
  }

  var lastCol = vals[vals.length - 1], totalCol = -1;

  /* cột "Tổng cộng": nhận theo tên trước, vì có tab tổng ngày không bằng tổng
     các cột (cột gộp hai người chỉ ghi số của một người) */
  for(i = 0; i < vals.length; i++){
    if(/^t[oổ]ng/i.test(nameOf(vals[i]))){ totalCol = vals[i]; break; }
  }
  if(totalCol >= 0){
    vals = vals.filter(function(cc){ return cc < totalCol; });
  }else{
    var agree = 0, checked = 0;
    for(i = 0; i < rows.length; i++){
      var sum = 0, any = false;
      for(var j = 0; j < vals.length - 1; j++){
        var v = num(cell(g, rows[i].row, vals[j]));
        if(v){ any = true; sum += v; }
      }
      var tv = num(cell(g, rows[i].row, lastCol));
      if(tv == null) continue;
      if(!any && !tv) continue;
      checked++;
      if(Math.abs(tv - sum) <= Math.max(2, sum * 0.01)) agree++;
    }
    if(checked && agree * 2 >= checked){ totalCol = lastCol; vals.pop(); }
  }
  if(!vals.length) return null;

  /* cột ghi chú CK: theo tên, không có thì lấy cột chữ đầu tiên sau khối số */
  var noteCol = -1, from = (totalCol >= 0 ? totalCol : lastCol) + 1;
  for(c = from; c < Math.min(W, from + 4); c++){
    if(/^ck/i.test(nameOf(c))){ noteCol = c; break; }
  }
  if(noteCol < 0){
    for(c = from; c < Math.min(W, from + 4); c++){
      var t = 0;
      for(i = 0; i < rows.length; i++){ if(txt(cell(g, rows[i].row, c))) t++; }
      if(t){ noteCol = c; break; }
    }
  }

  var people = vals.map(function(cc, idx){
    return { col: cc, name: nameOf(cc) || ("Người " + (idx + 1)) };
  });

  var days = rows.map(function(rw){
    var shares = people.map(function(p){
      return { name: p.name, value: num(cell(g, rw.row, p.col)) || 0 };
    });
    return {
      label: rw.label,
      shares: shares,
      total: totalCol >= 0 ? (num(cell(g, rw.row, totalCol)) || 0)
                           : shares.reduce(function(a, b){ return a + b.value; }, 0),
      note: noteCol >= 0 ? txt(cell(g, rw.row, noteCol)) : ""
    };
  });
  return { days: days, people: people.map(function(p){ return p.name; }) };
}

/* ---------- đọc bảng chi phí nhà (danh mục × người) ---------- */
function parseMatrix(g, labels, prev){
  var hr = -1, cc = -1, r, c, W = width(g);
  for(r = 0; r < Math.min(g.length, 16) && hr < 0; r++){
    for(c = 0; c < (g[r] || []).length; c++){
      if(/^danh\s*m[uụ]c/i.test(txt(g[r][c]))){ hr = r; cc = c; break; }
    }
  }
  if(hr < 0) return null;
  var nameRow = hr + 1, people = [], group = "";
  for(c = cc + 2; c < W; c++){
    var gl = txt(cell(g, hr, c)); if(gl) group = gl;
    var nm = txt(cell(g, nameRow, c));
    if(!nm && labels){
      /* Đọc trực tiếp thì tên người ở cột số bị rỗng. Nhãn gộp cả nhóm lẫn tên
         ("Room 1 - 4tr6 Anh Phú"); lấy nhãn thiếu hàng cuối để tách ra. */
      var a = String(labels[c] == null ? "" : labels[c]).replace(/\s+/g, " ").trim();
      var b = prev ? String(prev[c] == null ? "" : prev[c]).replace(/\s+/g, " ").trim() : "";
      if(b && a.indexOf(b) === 0){ nm = a.slice(b.length).trim(); group = b; }
      else nm = a;
    }
    if(nm) people.push({ col: c, name: nm, group: group });
  }
  var cats = [], totalRow = null;
  for(r = nameRow + 1; r < g.length; r++){
    var name = txt(cell(g, r, cc)); if(!name) continue;
    var vals = people.map(function(p){ return num(cell(g, r, p.col)); });
    var sum = vals.reduce(function(a, b){ return a + (b || 0); }, 0);
    var row = { name: name, due: txt(cell(g, r, cc - 1)), total: num(cell(g, r, cc + 1)), sum: sum, vals: vals };
    if(/^t[oổ]ng/i.test(name)) totalRow = row; else cats.push(row);
  }
  return { kind:"matrix", people: people, cats: cats, totalRow: totalRow };
}

function parse(g, labels, prev){
  return parseLedger(g, labels) || parseMatrix(g, labels, prev) || { kind:"unknown" };
}

/* ---------- nạp dữ liệu ---------- */
function useSnapshot(why){
  var g = SNAPSHOT && SNAPSHOT[state.current];
  if(!g){
    state.error = "Bản sao ngoại tuyến không có tab “" + state.current + "”. Chọn tab khác hoặc bật nguồn trực tiếp.";
    state.data = null;
  }else{
    state.data = parse(g);
    state.source = "snapshot";
    state.fetchedAt = null;
    state.error = null;
  }
  state.liveNote = why || "";
  state.loading = false;
  render();
}

function reload(){
  state.loading = true; state.error = null; state.msg = ""; render();
  var want = state.current;
  var resetFilters = function(){ state.filterBuyer = "all"; state.filterDay = "all"; state.q = ""; };

  if(state.mode === "snapshot"){ resetFilters(); useSnapshot(""); return; }

  /* Hai lần gọi: một lấy toàn bộ ô, một lấy nhãn cột để biết tên người. */
  var main = gviz(want), heads = gviz(want, 9000, "auto").catch(function(){ return null; });
  function colLabels(res2){
    return (res2 && res2.status !== "error" && res2.table && res2.table.cols)
      ? res2.table.cols.map(function(cl){ return cl && cl.label ? cl.label : ""; })
      : null;
  }

  main.then(function(res){
    if(state.current !== want) return;
    if(!res || res.status === "error"){
      var m = res && res.errors && res.errors[0];
      var msg = (m && (m.detailed_message || m.message) || "Tab này không đọc được.").replace(/<[^>]*>/g, "");
      if(state.mode === "live"){ state.error = msg; state.data = null; state.loading = false; render(); }
      else { resetFilters(); useSnapshot("Google Sheet trả lỗi: " + msg); }
      return;
    }
    return heads.then(function(hres){
      if(state.current !== want) return;
      var labels = colLabels(hres);
      var nHead = (hres && hres.table && hres.table.parsedNumHeaders) || 0;
      var grid = fromGviz(res.table);

      function finish(data){
        if(state.current !== want) return;
        resetFilters();
        state.data = data;
        state.source = "live";
        state.fetchedAt = new Date();
        state.liveNote = "";
        state.loading = false;
        render();
      }

      var data = parse(grid, labels, null);
      /* Bảng chi phí nhà có tên người ở hàng tiêu đề cuối; cần thêm bản nhãn
         thiếu hàng đó để tách tên khỏi tên phòng. */
      if(data.kind === "matrix" && !data.people.length && labels && nHead >= 2){
        return gviz(want, 9000, nHead - 1).then(function(p2){
          finish(parse(grid, labels, colLabels(p2)));
        }).catch(function(){ finish(data); });
      }
      finish(data);
    });
  }).catch(function(e){
    if(state.current !== want) return;
    var why = e && e.message === "blocked"
      ? "Môi trường này chặn kết nối tới Google Sheet nên app đang chạy trên bản sao."
      : "Không gọi được Google Sheet (mạng chậm hoặc bị chặn) nên app đang chạy trên bản sao.";
    if(state.mode === "live"){
      state.error = why.replace("nên app đang chạy trên bản sao.", "— bật lại chế độ Tự động để dùng bản sao.");
      state.data = null; state.loading = false; render();
    }else{
      resetFilters(); useSnapshot(why);
    }
  });
}

/* ---------- dò tab mới (chỉ hiệu quả khi đang chạy trực tiếp) ---------- */
function candidates(){
  var out = [], now = new Date(), i;
  for(i = -1; i < 3; i++){
    var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    var mm = d.getMonth() + 1, yy = d.getFullYear();
    var dim = new Date(yy, mm, 0).getDate();
    [1,8,15,22,29].forEach(function(st){
      [6,7].forEach(function(len){
        var en = st + len, em = mm;
        if(en > dim){ en -= dim; em = mm === 12 ? 1 : mm + 1; }
        out.push(st + "." + mm + "-" + en + "." + em);
      });
    });
    out.push(mm + "/" + yy, "Tháng " + mm, "Tháng " + mm + "/" + yy, "T" + mm);
  }
  out.push("Nhà");
  var seen = {}, res = [];
  out.forEach(function(n){ if(!seen[n] && state.sheets.indexOf(n) < 0){ seen[n] = 1; res.push(n); } });
  return res;
}
function scan(){
  if(state.busy) return;
  var list = candidates(), found = 0, done = 0, idx = 0, running = 0;
  state.busy = "scan"; state.msg = "Đang dò 0/" + list.length + "…"; render();
  function step(){
    while(running < 5 && idx < list.length){
      var nm = list[idx++]; running++;
      (function(nm){
        gviz(nm, 8000).then(function(res){
          if(res && res.status !== "error" && res.table && (res.table.rows || []).length){
            if(state.sheets.indexOf(nm) < 0){ state.sheets.push(nm); found++; }
          }
        }).catch(function(){}).then(function(){
          running--; done++;
          state.msg = "Đang dò " + done + "/" + list.length + "…";
          if(done % 5 === 0) render();
          if(done === list.length){
            state.busy = "";
            state.msg = found ? ("Đã thêm " + found + " tab mới.")
                              : "Không tìm thấy tab nào khác. Nếu đang chạy trên bản sao thì chức năng dò không hoạt động.";
            save(); render();
          }else step();
        });
      })(nm);
    }
  }
  step();
}

/* ---------- mảnh giao diện ---------- */
function colorOf(i){ return "var(--c" + ((i % 6) + 1) + ")"; }
function sumItems(l){ return l.reduce(function(a, b){ return a + (b.amount || 0); }, 0); }
function byKey(list, keyFn){
  var m = {}, order = [];
  list.forEach(function(it){
    var k = keyFn(it);
    if(!(k in m)){ m[k] = { key:k, items:[], total:0 }; order.push(k); }
    m[k].items.push(it); m[k].total += (it.amount || 0);
  });
  return order.map(function(k){ return m[k]; });
}
function barsHTML(rows, max){
  return '<div class="bars">' + rows.map(function(r){
    var w = max > 0 ? Math.max(1.5, (r.value / max) * 100) : 0;
    return '<div class="bar"><div class="top"><b>' + esc(r.label) + '</b><span>' + esc(vnd(r.value)) +
      (r.pct != null ? " · " + r.pct + "%" : "") + '</span></div><div class="track"><div class="fill" style="width:' +
      w.toFixed(1) + '%;background:' + (r.color || "var(--accent)") + '"></div></div></div>';
  }).join("") + '</div>';
}
function donutHTML(rows, total){
  var R = 52, C = 2 * Math.PI * R, off = 0;
  var segs = rows.filter(function(r){ return r.value > 0; }).map(function(r, i){
    var len = (total > 0 ? r.value / total : 0) * C;
    var el = '<circle cx="59" cy="59" r="' + R + '" fill="none" stroke="' + (r.color || colorOf(i)) +
      '" stroke-width="14" stroke-dasharray="' + len.toFixed(2) + " " + (C - len).toFixed(2) +
      '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 59 59)"></circle>';
    off += len; return el;
  }).join("");
  return '<div class="donut"><svg viewBox="0 0 118 118" role="img" aria-label="Tỉ lệ chi tiêu">' +
    '<circle cx="59" cy="59" r="' + R + '" fill="none" stroke="var(--surface-2)" stroke-width="14"></circle>' + segs +
    '<text x="59" y="56" text-anchor="middle" fill="var(--muted)" font-size="9">Tổng</text>' +
    '<text x="59" y="70" text-anchor="middle" fill="var(--fg)" font-size="13" font-weight="600">' + esc(short(total)) + '</text>' +
    '</svg><div class="legend">' + rows.map(function(r, i){
      return '<div><i style="background:' + (r.color || colorOf(i)) + '"></i><b>' + esc(r.label) + '</b><span>' +
        esc(short(r.value)) + " · " + (total > 0 ? Math.round(r.value / total * 100) : 0) + '%</span></div>';
    }).join("") + '</div></div>';
}
function colsHTML(points){
  var max = points.reduce(function(a, p){ return Math.max(a, p.value); }, 0);
  return '<div class="cols">' + points.map(function(p){
    var h = max > 0 ? (p.value / max) * 100 : 0;
    return '<div class="col' + (p.value ? "" : " zero") + '"><div class="v">' + (p.value ? esc(short(p.value)) : "") +
      '</div><div class="b" style="height:' + Math.max(p.value ? 3 : 1.5, h).toFixed(1) + '%"></div><div class="d">' +
      esc(p.label) + '</div></div>';
  }).join("") + '</div>';
}

/* ---------- Tổng quan ---------- */
function viewOverview(){
  var d = state.data;
  if(d.kind === "matrix") return matrixOverview(d);
  var items = d.items, total = sumItems(items);
  var dates = items.map(function(i){ return i.date; }).filter(Boolean).sort(function(a, b){ return a - b; });
  var range = dates.length ? dshort(dates[0]) + " – " + dshort(dates[dates.length-1]) : "chưa ghi ngày";
  var buyers = byKey(items, function(i){ return i.buyer; }).sort(function(a, b){ return b.total - a.total; });
  var dayGroups = byKey(items.filter(function(i){ return i.date; }), function(i){ return dkey(i.date); })
                    .sort(function(a, b){ return a.key < b.key ? -1 : 1; });
  var splitTotal = d.days.reduce(function(a, b){ return a + (b.total || 0); }, 0);
  var noPrice = items.filter(function(i){ return i.amount == null; }).length;

  var h = '<div class="hero"><div class="lab">Tổng chi tuần này</div><div class="big">' + esc(vnd(total)) + '</div>' +
    '<div class="sub">' + items.length + " khoản · " + esc(range) + '</div><div class="statgrid">' +

/* ---------- Thanh toán: ai phải trả, ai nhận lại ---------- */
function nameKey(s){
  return String(s || "").toLowerCase().replace(/\./g, " ").replace(/\s+/g, " ")
    .replace(/^(anh|ch[iị]|em|c[oô]|ch[uú]|b[aạ]n|a|c|e)\s+/, "").trim();
}
/* Tính theo từng ngày, khớp với cách sheet ghi "CK mỗi người":
   - Người mua chỉ được tính phần tiền đã đưa vào ô "Tổng cộng" của ngày đó.
     Phần mua nhiều hơn (đồ dư) người mua giữ lại, chưa ai nợ.
   - Ngày nào các cột chia cộng không đủ "Tổng cộng" thì phần thiếu chỉ trừ vào
     người đã ứng hôm đó, không lan sang người khác trong tuần. */
function settle(d){
  var groups = [];
  var names = d.days.length ? d.days[0].shares.map(function(s){ return s.name; }) : [];
  names.forEach(function(nm, i){
    groups.push({
      label: nm,
      parts: nm.split(/\s*\+\s*/).map(nameKey).filter(Boolean),
      owed: d.days.reduce(function(a, day){ return a + (day.shares[i] ? day.shares[i].value : 0); }, 0),
      paid: 0, credit: 0, held: 0, uncovered: 0, gapDays: []
    });
  });
  function groupOf(buyer){
    var k = nameKey(buyer);
    for(var i = 0; i < groups.length; i++){ if(groups[i].parts.indexOf(k) >= 0) return groups[i]; }
    var g = { label: buyer, parts: [k], owed: 0, paid: 0, credit: 0, held: 0, uncovered: 0, gapDays: [], orphan: true };
    groups.push(g);
    return g;
  }

  var dayOf = {};
  d.days.forEach(function(day){ dayOf[day.label] = day; });

  var buckets = {}, loose = [];
  d.items.forEach(function(it){
    if(it.amount == null) return;
    var g = groupOf(it.buyer);
    g.paid += it.amount;
    var lbl = it.date ? dshort(it.date) : "";
    if(dayOf[lbl]) (buckets[lbl] = buckets[lbl] || []).push({ g: g, amt: it.amount });
    else { g.held += it.amount; loose.push({ name: g.label, amt: it.amount, item: it.name }); }
  });

  var heldRows = [], gapRows = [];
  d.days.forEach(function(day){
    var list = buckets[day.label] || [];
    var bought = list.reduce(function(a, x){ return a + x.amt; }, 0);
    var shareSum = day.shares.reduce(function(a, s){ return a + s.value; }, 0);
    var credited = Math.min(bought, day.total);
    var k = bought > 0 ? credited / bought : 0;

    var per = [];
    list.forEach(function(x){
      var c = x.amt * k, h = x.amt - c;
      x.g.credit += c; x.g.held += h;
      var p = null;
      for(var i = 0; i < per.length; i++){ if(per[i].g === x.g) p = per[i]; }
      if(!p){ p = { g: x.g, credit: 0, held: 0 }; per.push(p); }
      p.credit += c; p.held += h;
    });
    per.forEach(function(p){
      if(p.held > 1) heldRows.push({ day: day.label, name: p.g.label, amt: p.held });
    });

    var gap = credited - shareSum;
    if(Math.abs(gap) <= 1) return;
    var who = [];
    if(gap > 0 && credited > 0){
      /* cột chia thu không đủ: người ứng hôm đó nhận về ít hơn */
      per.forEach(function(p){
        var u = gap * p.credit / credited;
        p.g.uncovered += u;
        p.g.gapDays.push({ day: day.label, amt: u });
        who.push({ name: p.g.label, amt: u });
      });
    }else if(gap < 0 && shareSum > 0){
      /* cột chia thu nhiều hơn số tiền đã ứng: giảm phần phải trả theo tỉ lệ */
      day.shares.forEach(function(s, i){
        var g = groups[i]; if(!g || !s.value) return;
        var u = -gap * s.value / shareSum;
        g.owed -= u;
        who.push({ name: g.label, amt: -u });
      });
    }
    /* đoán nguyên nhân: cột ghép nhiều người chỉ ghi số của một người */
    var hint = null;
    if(gap > 0){
      var pairs = day.shares.filter(function(s){ return /\+/.test(s.name) && s.value > 0; });
      var extra = pairs.reduce(function(a, s){
        return a + s.value * (s.name.split(/\s*\+\s*/).length - 1);
      }, 0);
      if(pairs.length && Math.abs(extra - gap) <= 2){
        hint = pairs.map(function(s){
          var n = s.name.split(/\s*\+\s*/).length;
          return { name: s.name, people: n, now: s.value, should: s.value * n };
        });
      }
    }
    gapRows.push({ day: day.label, total: day.total, credited: credited, sum: shareSum, gap: gap, who: who, hint: hint });
  });

  groups.forEach(function(g){ g.net = g.credit - g.uncovered - g.owed; });
  return { groups: groups, held: heldRows, loose: loose, gaps: gapRows };
}
function transfers(groups){
  var cred = groups.filter(function(g){ return g.net > 500; })
    .map(function(g){ return { name: g.label, want: g.net, amt: g.net }; })
    .sort(function(a, b){ return b.want - a.want; });
  var debt = groups.filter(function(g){ return g.net < -500; })
    .map(function(g){ return { name: g.label, owe: -g.net, amt: -g.net }; })
    .sort(function(a, b){ return b.owe - a.owe; });

  var tc = cred.reduce(function(a, b){ return a + b.want; }, 0);
  var td = debt.reduce(function(a, b){ return a + b.owe; }, 0);
  /* Hai phía không bằng nhau thì co phía lớn hơn theo tỉ lệ, để phần thiếu
     chia đều cho mọi người thay vì dồn hết vào người xếp cuối. */
  if(tc > td && tc > 0){ var k = td / tc; cred.forEach(function(c){ c.amt = c.want * k; }); }
  if(td > tc && td > 0){ var k2 = tc / td; debt.forEach(function(d){ d.amt = d.owe * k2; }); }

  var out = [], i = 0, j = 0, guard = 0;
  while(i < debt.length && j < cred.length && guard++ < 400){
    var m = Math.min(debt[i].amt, cred[j].amt);
    if(m > 500) out.push({ from: debt[i].name, to: cred[j].name, amt: m });
    debt[i].amt -= m; cred[j].amt -= m;
    if(debt[i].amt <= 500) i++;
    if(cred[j].amt <= 500) j++;
  }
  /* short[tên] = phần chưa được hoàn (chủ nợ) hoặc phần chưa phải trả (con nợ) */
  var short = {};
  cred.forEach(function(c){ var g = c.want - (tc > td && tc > 0 ? c.want * (td / tc) : c.want); if(g > 500) short[c.name] = g; });
  debt.forEach(function(d){ var g = d.owe - (td > tc && td > 0 ? d.owe * (tc / td) : d.owe); if(g > 500) short[d.name] = -g; });
  return { moves: out, short: short };
}
function viewPay(){
  var d = state.data;
  if(d.kind === "matrix") return matrixPay(d);
  if(!d.items.length && !d.days.length) return '<div class="empty">Tab này chưa có gì để tính.</div>';

  var groups = res.groups.slice().sort(function(a, b){ return b.net - a.net; });
  var moves = transfers(groups).moves;
  var need = moves.reduce(function(a, m){ return a + m.amt; }, 0);
  var paidTotal = groups.reduce(function(a, g){ return a + g.paid; }, 0);
  var owedTotal = groups.reduce(function(a, g){ return a + g.owed; }, 0);

      return '<div class="row"><div class="main"><div class="nm">' + esc(g.label) + '</div>' +
        '<div class="me">' + tag + (g.orphan ? '<span class="chip warn">chưa có trong bảng chia</span>' : "") + '</div>' +
        '<div class="me calc">' + esc(calc.join(' − ')) + '</div></div>' +
        '<div class="amt" style="color:' + (g.net > 500 ? "var(--accent)" : g.net < -500 ? "var(--warn)" : "var(--muted)") + '">' +
        (g.net > 500 ? "+" : "") + esc(vnd(g.net)) + '</div></div>';
    }).join("") + '</div></div>';

  h += '<div class="card"><div class="ttl"><h2>Chuyển khoản gọn nhất</h2></div>' +
    (moves.length
      ? '<div class="rows">' + moves.map(function(m){
          return '<div class="row"><div class="main"><div class="nm">' + esc(m.from) + " → " + esc(m.to) +

        }).join("") + '</div>'
      : '<div class="empty" style="padding:18px 0">Không ai nợ ai, mọi người đã cân bằng.</div>') + '</div>';

  /* Vì sao tiền ứng không khớp phần chia */
  if(heldTotal > 1 || res.gaps.length){
    h += '<div class="card"><div class="ttl"><h2>Vì sao còn ' + esc(vnd(paidTotal - owedTotal)) + ' chưa chia</h2></div>';

            esc(r.day) + ': tiền mua nhiều hơn ô Tổng cộng</span></div></div><div class="amt">' + esc(vnd(r.amt)) + '</div></div>';
        }).join("") +

            esc(r.item) + ': chưa có ngày trong bảng chia</span></div></div><div class="amt">' + esc(vnd(r.amt)) + '</div></div>';

    if(res.gaps.length){
      h += '<div class="sub2">Ngày các cột chia cộng không đủ · ' + esc(vnd(gapTotal)) + '</div><div class="rows">' +
        res.gaps.map(function(r){
          var fix = r.hint ? '<div class="me"><span class="chip warn">' + r.hint.map(function(x){
              return 'Cột ' + x.name + ' (' + x.people + ' người) chỉ ghi 1 suất ' + n(x.now) + ' đ. Ghi ' + n(x.should) + ' đ thì khớp';
            }).join('; ') + '</span></div>' : "";
          var who = r.who.length ? '<div class="me"><span>Tạm trừ vào người ứng hôm đó: ' + r.who.map(function(x){
              return esc(x.name) + ' ' + n(x.amt);
            }).join(', ') + '</span></div>' : "";
          return '<div class="row"><div class="main"><div class="nm">Ngày ' + esc(r.day) + '</div><div class="me"><span>cộng các cột ' +
            n(r.sum) + ' · Tổng cộng ' + n(r.credited) + '</span></div>' + fix + who + '</div><div class="amt" style="color:var(--warn)">' +
            esc(vnd(r.gap)) + '</div></div>';
        }).join("") + '</div><div class="note" style="margin-top:8px">Sửa ô đó trong sheet rồi tải lại, phần thiếu tự biến mất.</div>';
    }
    h += '</div>';
  }

  var notes = d.days.filter(function(day){ return day.note; });
  if(notes.length){
    h += '<div class="card"><div class="ttl"><h2>Ghi chú CK trong sheet</h2></div><div class="rows">' +
      notes.map(function(day){
        return '<div class="row"><div class="main"><div class="nm">' + esc(day.note) + '</div><div class="me"><span>ngày ' +
          esc(day.label) + '</span></div></div><div class="amt">' + esc(vnd(day.total)) + '</div></div>';
      }).join("") + '</div></div>';
  }
  return h;
}
function matrixPay(d){
  var per = d.people.map(function(p, i){
    var v = d.totalRow ? d.totalRow.vals[i] : d.cats.reduce(function(a, c){ return a + (c.vals[i] || 0); }, 0);
    return { name: p.name, group: p.group, value: v || 0 };
  }).filter(function(p){ return p.value > 0; }).sort(function(a, b){ return b.value - a.value; });
  var grand = per.reduce(function(a, p){ return a + p.value; }, 0);
  var due = d.cats.filter(function(c){ return c.due; }).map(function(c){ return c.name + " " + c.due; });

  var h = '<div class="hero"><div class="lab">Cả nhà phải đóng</div><div class="big">' + esc(vnd(grand)) + '</div>' +
    '<div class="sub">' + per.length + " người" + (due.length ? " · hạn gần nhất " + esc(d.cats.filter(function(c){ return c.due; })[0].due) : "") + '</div></div>';
  h += '<div class="card"><div class="ttl"><h2>Mỗi người phải trả</h2></div><div class="rows">' + per.map(function(p){
    return '<div class="row"><div class="main"><div class="nm">' + esc(p.name) + '</div><div class="me">' +
      (p.group ? '<span class="chip">' + esc(p.group) + '</span>' : "") +
      '<span>' + (grand ? Math.round(p.value / grand * 100) : 0) + '% tổng</span></div></div>' +
      '<div class="amt" style="color:var(--warn)">' + esc(vnd(p.value)) + '</div></div>';
  }).join("") + '</div><div class="note" style="margin-top:10px">Tiền nhà chia sẵn theo người trong sheet, không ai ứng hộ nên không có khoản nhận lại.</div></div>';
  return h;
}

/* ---------- Thống kê ---------- */
function viewStats(){
  var d = state.data;
  if(d.kind === "matrix") return matrixStats(d);
  var items = d.items, total = sumItems(items);
  if(!items.length) return '<div class="empty">Tab này chưa có khoản chi nào.</div>';

  var buyers = byKey(items, function(i){ return i.buyer; }).sort(function(a, b){ return b.total - a.total; });
  var h = '<div class="card"><div class="ttl"><h2>Tỉ lệ theo người ứng</h2></div>' +
    donutHTML(buyers.map(function(b, i){ return { label: b.key, value: b.total, color: colorOf(i) }; }), total) + '</div>';

  if(d.days.length){
    var sums = {};
    d.days.forEach(function(day){ day.shares.forEach(function(s){ sums[s.name] = (sums[s.name] || 0) + s.value; }); });
    var names = Object.keys(sums).filter(function(n){ return sums[n] > 0; });
    if(names.length){
      var mx = names.reduce(function(a, n){ return Math.max(a, sums[n]); }, 0);
      h += '<div class="card"><div class="ttl"><h2>Mỗi người phải trả</h2><em>theo bảng chia</em></div>' +
        barsHTML(names.map(function(n, i){ return { label: n, value: sums[n], color: colorOf(i) }; }), mx) +
        '<div class="note" style="margin-top:10px">Cộng dồn các cột chia tiền trong sheet, không phải số tiền đã ứng.</div></div>';
    }
  }

  var dayGroups = byKey(items.filter(function(i){ return i.date; }), function(i){ return dkey(i.date); })
                    .sort(function(a, b){ return a.key < b.key ? -1 : 1; });
  if(dayGroups.length){
    h += '<div class="card"><div class="ttl"><h2>Theo ngày</h2><em>TB ' + esc(short(total / dayGroups.length)) + '/ngày</em></div>' +
      barsHTML(dayGroups.map(function(g){
        return { label: dlong(new Date(g.key)) + " · " + g.items.length + " khoản", value: g.total };
      }), dayGroups.reduce(function(a, g){ return Math.max(a, g.total); }, 0)) + '</div>';
  }

  var top = items.filter(function(i){ return i.amount; }).sort(function(a, b){ return b.amount - a.amount; }).slice(0, 6);
  h += '<div class="card"><div class="ttl"><h2>Khoản lớn nhất</h2></div><div class="rows">' + top.map(function(it){
    return '<div class="row"><div class="main"><div class="nm">' + esc(it.name) + '</div><div class="me"><span>' + esc(it.buyer) +
      '</span><span>·</span><span>' + esc(dshort(it.date)) + '</span><span class="chip">' +
      (total ? Math.round(it.amount / total * 100) : 0) + '% tuần</span></div></div><div class="amt">' + esc(vnd(it.amount)) + '</div></div>';
  }).join("") + '</div></div>';

  /* Chỉ lấy dòng có ghi "Dư lại". Cột bên cạnh không phải lúc nào cũng là giá trị
     đồ dư: ngày 01/10 nó là phần chia mỗi người (thịt bò 250.000 / 6 = 41.667). */
  var left = items.filter(function(i){ return i.leftQty; });
  if(left.length){
    h += '<div class="card"><div class="ttl"><h2>Còn dư trong bếp</h2><em>' +
      esc(vnd(left.reduce(function(a, b){ return a + (b.leftVal || 0); }, 0))) + '</em></div><div class="rows">' +
      left.map(function(it){
        return '<div class="row"><div class="main"><div class="nm">' + esc(it.name) + '</div><div class="me"><span>còn ' +
          esc(it.leftQty || "—") + '</span><span>·</span><span>mua ' + esc(dshort(it.date)) +
          '</span></div></div><div class="amt">' + (it.leftVal ? esc(vnd(it.leftVal)) : "—") + '</div></div>';
      }).join("") + '</div></div>';
  }
  return h;
}
function matrixStats(d){
  var totals = d.people.map(function(p, i){
    var v = d.totalRow ? d.totalRow.vals[i] : d.cats.reduce(function(a, c){ return a + (c.vals[i] || 0); }, 0);
    return { label: p.name, value: v || 0, color: colorOf(i) };
  });
  var grand = totals.reduce(function(a, b){ return a + b.value; }, 0);
  var h = '<div class="card"><div class="ttl"><h2>Tỉ lệ đóng góp</h2></div>' + donutHTML(totals, grand) + '</div>';
  var groups = {};
  d.people.forEach(function(p, i){ var k = p.group || "Khác"; groups[k] = (groups[k] || 0) + totals[i].value; });
  var gl = Object.keys(groups).map(function(k){ return { label: k, value: groups[k] }; }).sort(function(a, b){ return b.value - a.value; });
  if(gl.length > 1) h += '<div class="card"><div class="ttl"><h2>Theo phòng</h2></div>' + barsHTML(gl, gl[0].value) + '</div>';
  var cats = d.cats.map(function(c){ return { label: c.name, value: (c.total != null ? c.total : c.sum) || 0, pct: 0 }; })
    .filter(function(c){ return c.value; }).sort(function(a, b){ return b.value - a.value; });
  cats.forEach(function(c){ c.pct = grand ? Math.round(c.value / grand * 100) : 0; });
  if(cats.length) h += '<div class="card"><div class="ttl"><h2>Danh mục tốn nhất</h2></div>' + barsHTML(cats, cats[0].value) + '</div>';
  return h;
}

/* ---------- Sheet ---------- */
function viewSheets(){
  var live = state.source === "live";
  var h = '<div class="card"><div class="ttl"><h2>Nguồn dữ liệu</h2></div>' +
    '<div class="filters" id="fMode" style="overflow:visible;flex-wrap:wrap">' +
      '<button class="pill" data-v="auto" aria-pressed="' + (state.mode === "auto") + '">Tự động</button>' +
      '<button class="pill" data-v="live" aria-pressed="' + (state.mode === "live") + '">Chỉ Google Sheet</button>' +
      '<button class="pill" data-v="snapshot" aria-pressed="' + (state.mode === "snapshot") + '">Chỉ bản sao</button>' +
    '</div><div class="hint" style="margin-top:10px">' +
      (state.mode === "auto"
        ? "App thử gọi Google Sheet trước; nơi nào chặn kết nối thì tự dùng bản sao kèm theo. Đem file này lên hosting thật là nó tự chạy dữ liệu trực tiếp."
        : state.mode === "live" ? "Chỉ đọc Google Sheet. Nếu bị chặn, app báo lỗi thay vì dùng bản sao."
        : "Chỉ đọc bản sao kèm theo file, không gọi mạng.") +
    '</div>' +
    '<div class="diff" style="margin-top:12px"><span>Đang dùng: <b>' +
      (live ? "Google Sheet trực tiếp" : "bản sao (chụp " + SNAP_TAKEN + ")") + "</b>" +
      (state.fetchedAt ? " · đọc lúc " + hhmm(state.fetchedAt) : "") + '</span></div>' +
    (state.liveNote ? '<div class="hint" style="margin-top:10px">' + esc(state.liveNote) + '</div>' : "") +
    '<div class="btnrow" style="margin-top:12px"><button class="btn pri" id="reloadBtn">Tải lại ngay</button>' +
    '<a class="btn" href="' + SHEET_URL + '" target="_blank" rel="noopener">Mở Google Sheet</a></div></div>';

  h += '<div class="card"><div class="ttl"><h2>Chọn tab</h2><em>' + state.sheets.length + ' tab</em></div>' +
    state.sheets.map(function(s){
      var inSnap = SNAP_SHEETS.indexOf(s) >= 0;
      return '<div class="opt" role="radio" tabindex="0" aria-checked="' + (s === state.current) + '" data-sheet="' + esc(s) + '">' +
        '<span class="rd"></span><span class="nm">' + esc(s) + '</span>' +
        (inSnap ? "" : '<span class="chip">chỉ khi trực tiếp</span>') +
        (inSnap ? "" : '<button class="chip" data-del="' + esc(s) + '">Xoá</button>') + '</div>';
    }).join("") + '</div>';

  h += '<div class="card"><div class="ttl"><h2>Thêm tab mới</h2></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="newSheet" placeholder="Tên tab, ví dụ 16.10-22.10" style="flex:1;min-width:160px">' +
    '<button class="btn pri" id="addSheet">Thêm</button></div>' +
    '<div class="btnrow" style="margin-top:12px"><button class="btn" id="scanBtn"' + (state.busy ? " disabled" : "") + '>' +
      (state.busy === "scan" ? "Đang dò…" : "Tự dò tab theo tuần") + '</button></div>' +
    (state.msg ? '<div class="hint" style="margin-top:10px">' + esc(state.msg) + '</div>' : "") +
    '<div class="hint" style="margin-top:10px">Tab thêm bằng tay chỉ đọc được khi app chạy trực tiếp với Google Sheet. Bản sao chỉ có ' +
      SNAP_SHEETS.length + ' tab gốc.</div></div>';
  return h;
}

/* ---------- render ---------- */
function skeleton(){
  return '<div class="hero"><div class="sk" style="height:12px;width:40%"></div><div class="sk" style="height:34px;width:66%;margin-top:10px"></div>' +
    '<div class="sk" style="height:12px;width:50%;margin-top:10px"></div></div>' +
    '<div class="card"><div class="sk" style="height:12px;width:35%"></div><div class="sk" style="height:120px;margin-top:12px"></div></div>' +
    '<div class="card"><div class="sk" style="height:12px;width:30%"></div><div class="sk" style="height:90px;margin-top:12px"></div></div>';
}
function render(){
  document.getElementById("shName").textContent = state.current;
  document.getElementById("shMeta").textContent = state.loading ? "đang đọc…"
    : state.source === "live" && state.fetchedAt ? "cập nhật " + hhmm(state.fetchedAt)
    : state.source === "snapshot" ? "bản sao " + SNAP_TAKEN : "Chi Phí Nhà Hàng Tháng";
  var chip = document.getElementById("srcChip");
  chip.className = "src" + (state.source === "live" ? " live" : "");
  chip.innerHTML = "<i></i>" + (state.loading ? "đang nối" : state.source === "live" ? "Trực tiếp" : "Bản sao");
  document.getElementById("btnReload").classList.toggle("spin", state.loading);
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.setAttribute("aria-selected", String(t.dataset.tab === state.tab));
  });

  var html;
  if(state.tab === "sheets") html = viewSheets();
  else if(state.loading && !state.data) html = skeleton();
  else if(state.error) html = '<div class="err">' + esc(state.error) + '</div><div class="btnrow" style="margin-top:12px"><button class="btn pri" id="retry">Thử lại</button></div>';
  else if(!state.data) html = '<div class="empty">Chưa có dữ liệu.</div>';
  else if(state.data.kind === "unknown") html = '<div class="err">Không nhận ra cấu trúc tab “' + esc(state.current) +
    '”. App đọc được hai kiểu bảng: bảng mua hàng (có cột “Người mua”) và bảng chi phí nhà (có cột “Danh mục”).</div>';
  else if(state.tab === "overview") html = viewOverview();
  else if(state.tab === "list") html = viewList();
  else if(state.tab === "pay") html = viewPay();
  else html = viewStats();

  document.getElementById("view").innerHTML = "<section>" + html + "</section>";
  wire();
}

function wire(){
  var q = document.getElementById("q");
  if(q) q.addEventListener("input", function(){
    var pos = q.selectionStart; state.q = q.value; render();
    var q2 = document.getElementById("q");
    if(q2){ q2.focus(); try{ q2.setSelectionRange(pos, pos); }catch(e){} }
  });
  [["fBuyer","filterBuyer"], ["fDay","filterDay"]].forEach(function(p){
    var box = document.getElementById(p[0]); if(!box) return;
    box.addEventListener("click", function(e){
      var b = e.target.closest(".pill"); if(!b) return;
      state[p[1]] = b.dataset.v; render();
    });
  });
  var fm = document.getElementById("fMode");
  if(fm) fm.addEventListener("click", function(e){
    var b = e.target.closest(".pill"); if(!b || b.dataset.v === state.mode) return;
    state.mode = b.dataset.v; save(); reload();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(o){
    function pick(e){
      if(e.target.dataset && e.target.dataset.del){
        var nm = e.target.dataset.del;
        state.sheets = state.sheets.filter(function(s){ return s !== nm; });
        if(state.current === nm){ state.current = state.sheets[0]; save(); reload(); return; }
        save(); render(); return;
      }
      if(state.current === o.dataset.sheet) return;
      state.current = o.dataset.sheet; save(); state.tab = "overview"; window.scrollTo(0, 0); reload();
    }
    o.addEventListener("click", pick);
    o.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(e); } });
  });
  var add = document.getElementById("addSheet");
  if(add) add.addEventListener("click", function(){
    var inp = document.getElementById("newSheet"), nm = (inp.value || "").trim();
    if(!nm) return;
    if(state.sheets.indexOf(nm) >= 0){ state.msg = "Tab “" + nm + "” đã có trong danh sách."; render(); return; }
    if(state.mode === "snapshot"){ state.msg = "Đang ở chế độ chỉ bản sao, không kiểm tra được tab mới."; render(); return; }
    add.disabled = true; add.textContent = "Đang kiểm tra…";
    gviz(nm, 10000).then(function(res){
      if(res && res.status !== "error"){
        state.sheets.push(nm); state.current = nm; save(); state.tab = "overview"; reload();
      }else{
        state.msg = "Không có tab tên “" + nm + "” trong Google Sheet."; render();
      }
    }).catch(function(){
      state.msg = "Không gọi được Google Sheet từ môi trường này, nên chưa kiểm tra được tên tab."; render();
    });
  });
  var sc = document.getElementById("scanBtn"); if(sc) sc.addEventListener("click", scan);
  var rb = document.getElementById("reloadBtn"); if(rb) rb.addEventListener("click", reload);
  var rt = document.getElementById("retry"); if(rt) rt.addEventListener("click", reload);
}

Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
  t.addEventListener("click", function(){
    state.tab = t.dataset.tab;
    if(state.tab !== "sheets") state.msg = "";
    window.scrollTo(0, 0); render();
  });
});
document.getElementById("btnReload").addEventListener("click", reload);
document.getElementById("btnTheme").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next); save();
});
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && state.source === "live" && state.fetchedAt && Date.now() - state.fetchedAt.getTime() > 45000) reload();
});

load();
if(state.sheets.indexOf(state.current) < 0) state.current = state.sheets[0];
render();
reload();
})();
</script>

</body>
</html>
