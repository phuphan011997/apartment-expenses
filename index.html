/* ---------- Note: lưu vào MongoDB qua /api, không đụng tới Google Sheet ---------- */
var TK = "ctn:token";
var L = {
  status: "idle",          // idle | loading | ready | no_api | no_db | need_token | error
  msg: "", members: [], items: [],
  form: null, saving: false, err: "",
  delArm: "", flash: "", who: "all",
  memberMsg: "", busy: false
};
function tokenGet(){ try{ return localStorage.getItem(TK) || ""; }catch(e){ return ""; } }
function tokenSet(v){ try{ if(v) localStorage.setItem(TK, v); else localStorage.removeItem(TK); }catch(e){} }
function newId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function isoDate(s){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function memberName(id){
  for(var i = 0; i < L.members.length; i++){ if(L.members[i].id === id) return L.members[i].name; }
  return "(đã xoá)";
}
function sheetNames(){
  try{
    var m = SNAPSHOT && SNAPSHOT["Nhà"] ? parseMatrix(SNAPSHOT["Nhà"], null, null) : null;
    return m ? m.people.map(function(p){ return p.name; }) : [];
  }catch(e){ return []; }
}

function api(method, path, body){
  var opt = { method: method, headers: {}, cache: "no-store" };
  var t = tokenGet(); if(t) opt.headers["x-app-token"] = t;
  if(body !== undefined){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  function noApi(){ var e = new Error("no_api"); e.code = "no_api"; throw e; }
  return fetch("/api/" + path, opt).then(function(r){
    if((r.headers.get("content-type") || "").indexOf("application/json") < 0) noApi();
    return r.json().then(function(j){ j = j || {}; j.__status = r.status; return j; });
  }, noApi);
}

function blankForm(keep){
  return { id: "", title: "", date: keep ? keep.date : todayISO(),
           participants: keep ? keep.participants : {}, amount: "", payer: "", note: "" };
}
function formFrom(it){
  var p = {}; it.participants.forEach(function(x){ p[x] = 1; });
  return { id: it.id, title: it.title, date: it.date, participants: p,
           amount: it.amount == null ? "" : String(it.amount), payer: it.payer || "", note: it.note || "" };
}
/* Đọc lại ô nhập trước mỗi lần vẽ lại, để không mất chữ đang gõ */
function syncForm(){
  if(!L.form) return;
  var g = function(id){ var el = document.getElementById(id); return el ? el.value : null; }, v;
  if((v = g("lfTitle")) !== null) L.form.title = v;
  if((v = g("lfDate")) !== null) L.form.date = v;
  if((v = g("lfAmount")) !== null) L.form.amount = v.replace(/[^\d]/g, "");
  if((v = g("lfPayer")) !== null) L.form.payer = v;
  if((v = g("lfNote")) !== null) L.form.note = v;
}
function rerender(){ syncForm(); render(); }
/* keepForm: form vừa được đặt lại có chủ đích (sau khi lưu), đừng đọc chữ cũ
   trên màn hình đè lên. Các trường hợp khác vẫn đọc để không mất chữ đang gõ. */
function flash(t, keepForm){
  L.flash = t;
  if(keepForm) render(); else rerender();
  clearTimeout(flash._t);
  flash._t = setTimeout(function(){ L.flash = ""; if(state.tab === "items") rerender(); }, 2600);
}
function sortItems(){
  L.items.sort(function(a, b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (a.createdAt || "") < (b.createdAt || "") ? 1 : -1;
  });
}

function ledgerLoad(){
  L.status = "loading"; L.msg = "";
  if(state.tab === "items") rerender();
  api("GET", "health").then(function(h){
    if(h.db === "no_uri"){ L.status = "no_db"; return; }
    if(h.db !== "ok"){ L.status = "error"; L.msg = "Không kết nối được database. Thử lại sau ít phút."; return; }
    if(h.needsToken && !tokenGet()){ L.status = "need_token"; return; }
    return Promise.all([api("GET", "members"), api("GET", "items")]).then(function(r){
      if(r[0].__status === 401 || r[1].__status === 401){
        tokenSet(""); L.status = "need_token"; L.msg = "Mã truy cập không đúng, nhập lại."; return;
      }
      if(r[0].__status !== 200 || r[1].__status !== 200){
        L.status = "error"; L.msg = r[0].error || r[1].error || "Không tải được dữ liệu."; return;
      }
      L.members = r[0].members || [];
      L.items = r[1].items || [];
      sortItems();
      if(!L.form) L.form = blankForm();
      L.status = "ready";
    });
  }).catch(function(e){
    L.status = e && e.code === "no_api" ? "no_api" : "error";
    if(L.status === "error") L.msg = "Không tải được dữ liệu.";
  }).then(function(){ if(state.tab === "items") rerender(); });
}

function saveItem(){
  var f = L.form;
  var parts = Object.keys(f.participants).filter(function(k){ return f.participants[k]; });
  if(!f.title.trim()){ L.err = "Nhập tên note."; render(); return; }
  if(!isoDate(f.date)){ L.err = "Chọn ngày."; render(); return; }
  if(!parts.length){ L.err = "Chọn ít nhất một người tham gia."; render(); return; }
  var id = f.id || newId("it_"), editing = !!f.id;
  var body = { title: f.title, date: f.date, participants: parts,
               amount: f.amount === "" ? null : Number(f.amount), payer: f.payer || null, note: f.note };
  L.saving = true; L.err = ""; render();
  api("PUT", "items/" + id, body).then(function(r){
    L.saving = false;
    if(r.__status !== 200){ L.err = r.error || "Không lưu được, thử lại."; rerender(); return; }
    L.items = L.items.filter(function(x){ return x.id !== id; });
    L.items.push(r.item); sortItems();
    L.day = r.item.date; L.month = r.item.date.slice(0, 7);
    /* thêm mới thì giữ ngày và người tham gia cho lần nhập kế tiếp */
    L.form = editing ? blankForm() : blankForm(L.form);
    flash((editing ? "Đã sửa " : "Đã lưu ") + "“" + r.item.title + "”", true);
  }).catch(function(){ L.saving = false; L.err = "Mất kết nối, chưa lưu được."; rerender(); });
}
function deleteItem(id){
  if(L.delArm !== "it:" + id){
    L.delArm = "it:" + id; render();
    clearTimeout(deleteItem._t);
    deleteItem._t = setTimeout(function(){ L.delArm = ""; if(state.tab === "items") rerender(); }, 3500);
    return;
  }
  L.delArm = "";
  api("DELETE", "items/" + id).then(function(r){
    if(r.__status !== 200){ L.err = r.error || "Không xoá được."; rerender(); return; }
    var gone = L.items.filter(function(x){ return x.id === id; })[0];
    L.items = L.items.filter(function(x){ return x.id !== id; });
    var reset = L.form && L.form.id === id;
    if(reset){ syncForm(); L.form = blankForm(); }
    flash("Đã xoá “" + (gone ? gone.title : "") + "”", reset);
  }).catch(function(){ L.err = "Mất kết nối, chưa xoá được."; rerender(); });
}
function addMembers(names){
  names = names.map(function(s){ return s.replace(/\s+/g, " ").trim(); })
               .filter(function(s, i, a){ return s && a.indexOf(s) === i; })
               .filter(function(s){ return !L.members.some(function(m){ return m.name.toLowerCase() === s.toLowerCase(); }); });
  if(!names.length){ L.memberMsg = "Tên này đã có trong danh sách."; rerender(); return; }
  L.busy = true; L.memberMsg = ""; rerender();
  var base = L.members.length, chain = Promise.resolve();
  names.forEach(function(nm, i){
    chain = chain.then(function(){
      return api("PUT", "members/" + newId("m_"), { name: nm, order: base + i }).then(function(r){
        if(r.__status !== 200) throw new Error(r.error || "Không thêm được.");
        L.members.push(r.member);
      });
    });
  });
  chain.then(function(){ L.busy = false; flash("Đã thêm " + names.join(", ")); })
       .catch(function(e){ L.busy = false; L.memberMsg = e.message || "Không thêm được."; rerender(); });
}
function deleteMember(id){
  if(L.delArm !== "m:" + id){
    L.delArm = "m:" + id; render();
    clearTimeout(deleteMember._t);
    deleteMember._t = setTimeout(function(){ L.delArm = ""; if(state.tab === "items") rerender(); }, 3500);
    return;
  }
  L.delArm = "";
  api("DELETE", "members/" + id).then(function(r){
    if(r.__status !== 200){ L.memberMsg = r.error || "Không xoá được."; rerender(); return; }
    var nm = memberName(id);
    L.members = L.members.filter(function(m){ return m.id !== id; });
    if(L.form) delete L.form.participants[id];
    if(L.who === id) L.who = "all";
    flash("Đã xoá " + nm);
  }).catch(function(){ L.memberMsg = "Mất kết nối, chưa xoá được."; rerender(); });
}

function shareOf(it){ return it.amount ? it.amount / it.participants.length : 0; }
function formHint(){
  var f = L.form;
  var n = Object.keys(f.participants).filter(function(k){ return f.participants[k]; }).length;
  var amt = f.amount === "" ? 0 : Number(f.amount);
  if(!n && !amt) return "";
  var s = n + " người";
  if(amt) s += " · " + vnd(amt) + (n ? " · " + vnd(amt / n) + "/người" : "");
  return s;
}

function peopleOf(items){
  var seen = {};
  items.forEach(function(it){ it.participants.forEach(function(p){ seen[p] = 1; }); });
  return Object.keys(seen);
}
function noteCard(it){
  var armed = L.delArm === "it:" + it.id;
  return '<div class="ncard"><div class="ntop"><b>' + esc(it.title) + '</b>' +
      (it.amount ? '<span class="amt">' + esc(vnd(it.amount)) + '</span>' : "") + '</div>' +
    '<div class="nmeta"><span class="cnt">' + it.participants.length + ' người</span>' +
      (it.amount ? '<span>' + esc(vnd(shareOf(it))) + '/người</span>' : "") +
      (it.payer ? '<span>' + pdot(memberName(it.payer)) + esc(memberName(it.payer)) + ' trả</span>' : "") + '</div>' +
    '<div class="nchips">' + it.participants.map(function(p){
      return pchip(memberName(p), "", p === L.who ? "on" : "");
    }).join("") + '</div>' +
    (it.note ? '<div class="nnote">' + esc(it.note) + '</div>' : "") +
    '<div class="acts"><button class="lnk" data-act="edit" data-id="' + esc(it.id) + '">Sửa</button>' +
      '<button class="lnk warn" data-act="del" data-id="' + esc(it.id) + '">' + (armed ? "Bấm lần nữa để xoá" : "Xoá") + '</button></div></div>';
}
function noteDays(list){
  return byKey(list, function(it){ return it.date; }).map(function(g){
    return '<div class="sechead"><h2>' + esc(dlong(isoDate(g.key))) + '</h2><span class="sub3">' + g.items.length + ' note · ' +
      peopleOf(g.items).length + ' người</span></div>' + g.items.map(noteCard).join("");
  }).join("");
}
/* Lịch tháng: mỗi ô ngày có số note và số người tham gia, bấm vào để xem */
function noteCalendar(list){
  var byDay = {};
  list.forEach(function(it){ (byDay[it.date] = byDay[it.date] || []).push(it); });
  var latest = list.length ? list[0].date : todayISO();
  if(!L.month) L.month = (L.day || latest).slice(0, 7);
  var y = +L.month.slice(0, 4), mo = +L.month.slice(5, 7) - 1;
  var first = new Date(y, mo, 1), dim = new Date(y, mo + 1, 0).getDate();
  var lead = (first.getDay() + 6) % 7;   // tuần bắt đầu từ thứ Hai
  var iso = function(dd){ return y + "-" + pad(mo + 1) + "-" + pad(dd); };
  var inMonth = Object.keys(byDay).filter(function(k){ return k.slice(0, 7) === L.month; }).sort();
  var pick = L.day && L.day.slice(0, 7) === L.month ? L.day : (inMonth.slice(-1)[0] || "");
  var today = todayISO();

  var cells = "";
  for(var i = 0; i < lead; i++) cells += '<span class="cblank"></span>';
  for(var dd = 1; dd <= dim; dd++){
    var k = iso(dd), its = byDay[k] || [], ppl = peopleOf(its);
    cells += '<button class="cday' + (its.length ? " has" : "") + (k === pick ? " sel" : "") + (k === today ? " today" : "") +
      '" data-act="cday" data-d="' + k + '"><span class="dn">' + dd + '</span>' +
      (its.length ? '<span class="cn">' + its.length + '</span><span class="cp">' + ppl.length + ' người</span>' +
        '<span class="cdots">' + ppl.slice(0, 6).map(function(p){ return pdot(memberName(p)); }).join("") + '</span>' : "") +
      '</button>';
  }
  var h = '<div class="card ncal"><div class="calnav"><button class="iconbtn" data-act="mprev" aria-label="Tháng trước">' +
      '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></button>' +
      '<b>Tháng ' + (mo + 1) + '/' + y + '</b>' +
      '<button class="iconbtn" data-act="mnext" aria-label="Tháng sau"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></button></div>' +
    '<div class="cgrid">' + ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(function(w){ return '<span class="cw">' + w + '</span>'; }).join("") +
      cells + '</div></div>';
  if(pick){
    var its2 = byDay[pick] || [];
    h += '<div class="sechead"><h2>' + esc(dlong(isoDate(pick))) + '</h2><span class="sub3">' + its2.length + ' note · ' +
      peopleOf(its2).length + ' người</span></div>' +
      (its2.length ? its2.map(noteCard).join("") : '<div class="card"><div class="empty" style="padding:12px 0">Không có note ngày này.</div></div>');
  }
  return h;
}

function viewItems(){
  if(L.status === "idle" || L.status === "loading"){
    return '<div class="card"><div class="sk" style="height:12px;width:40%"></div><div class="sk" style="height:110px;margin-top:12px"></div></div>' +
           '<div class="card"><div class="sk" style="height:12px;width:30%"></div><div class="sk" style="height:70px;margin-top:12px"></div></div>';
  }
  if(L.status === "no_api"){
    return '<div class="card" id="ledger"><div class="ttl"><h2>Note</h2></div>' +
      '<div class="empty" style="padding:14px 0">Chưa kết nối được máy chủ.</div></div>';
  }
  if(L.status === "no_db"){
    return '<div class="card" id="ledger"><div class="ttl"><h2>Chưa nối database</h2></div>' +
      '<div class="btnrow"><button class="btn pri" data-act="retry">Kiểm tra lại</button></div></div>';
  }
  if(L.status === "need_token"){
    return '<div class="card" id="ledger"><div class="ttl"><h2>Nhập mã truy cập</h2></div>' +

      '<button class="btn pri" data-act="token">Mở</button></div>' +
      (L.msg ? '<div class="ferr">' + esc(L.msg) + '</div>' : "") + '</div>';
  }
  if(L.status === "error"){
    return '<div id="ledger"><div class="err">' + esc(L.msg || "Có lỗi khi tải dữ liệu.") + '</div>' +
      '<div class="btnrow" style="margin-top:12px"><button class="btn pri" data-act="retry">Thử lại</button></div></div>';
  }

  var h = '<div id="ledger" style="display:flex;flex-direction:column;gap:14px">';
  if(L.flash) h += '<div class="flash" role="status">' + esc(L.flash) + '</div>';

  /* chưa có ai: mời thêm người trước */
  if(!L.members.length){
    var seed = sheetNames();
    h += '<div class="card"><div class="ttl"><h2>Thêm người trong nhà</h2></div>' +

        '>Thêm ' + seed.length + ' người từ sheet</button></div>' : "") +
      '<div class="flabel">Hoặc gõ tên</div><div style="display:flex;gap:8px"><input type="text" id="lfMember" placeholder="Tên người" style="flex:1">' +
      '<button class="btn" data-act="addMember"' + (L.busy ? " disabled" : "") + '>Thêm</button></div>' +

    return h + '</div>';
  }

  /* form thêm / sửa */
  var f = L.form || (L.form = blankForm());
  var editing = !!f.id;
  h += '<div class="card"><div class="ttl"><h2>' + (editing ? "Sửa note" : "Thêm note") + '</h2>' +
    (editing ? '<button class="lnk" data-act="cancel">Huỷ sửa</button>' : "") + '</div>' +
    '<div class="quick">' + ["Ăn sáng", "Ăn trưa", "Ăn tối", "Đi chợ", "Cà phê"].map(function(q){
      return '<button class="chip" data-act="quick" data-v="' + q + '">' + q + '</button>';
    }).join("") + '</div>' +
    '<input type="text" id="lfTitle" maxlength="80" placeholder="Nội dung, ví dụ Ăn trưa" value="' + esc(f.title) + '">' +
    '<div class="frow" style="margin-top:8px">' +
      '<input type="date" id="lfDate" aria-label="Ngày" value="' + esc(f.date) + '">' +
      '<input type="text" id="lfAmount" inputmode="numeric" placeholder="Số tiền" value="' + esc(f.amount) + '">' +
    '</div>' +
    '<div class="flabel"><span>Người tham gia · ' + Object.keys(f.participants).filter(function(k){ return f.participants[k]; }).length + '</span><span style="display:flex;gap:12px">' +
      '<button class="lnk" data-act="all">Chọn hết</button><button class="lnk" data-act="none">Bỏ hết</button></span></div>' +
    '<div class="picks">' + L.members.map(function(m){
      return '<button class="pill" data-act="toggle" data-id="' + esc(m.id) + '" aria-pressed="' + (!!f.participants[m.id]) + '">' + pdot(m.name) + esc(m.name) + '</button>';
    }).join("") + '</div>' +
    '<div class="flabel">Người trả (tuỳ chọn)</div>' +
    '<select id="lfPayer"><option value="">Chưa ghi</option>' + L.members.map(function(m){
      return '<option value="' + esc(m.id) + '"' + (f.payer === m.id ? " selected" : "") + '>' + esc(m.name) + '</option>';
    }).join("") + '</select>' +
    '<input type="text" id="lfNote" maxlength="300" placeholder="Ghi chú (tuỳ chọn)" value="' + esc(f.note) + '" style="margin-top:8px">' +
    '<div class="hintline" id="lfHint">' + esc(formHint()) + '</div>' +
    (L.err ? '<div class="ferr">' + esc(L.err) + '</div>' : "") +
    '<div class="btnrow" style="margin-top:12px"><button class="btn pri" data-act="save"' + (L.saving ? " disabled" : "") + '>' +
      (L.saving ? "Đang lưu…" : editing ? "Lưu thay đổi" : "Lưu note") + '</button></div></div>';

  /* lọc theo người */
  var list = L.who === "all" ? L.items : L.items.filter(function(it){
    return it.participants.indexOf(L.who) >= 0 || it.payer === L.who;
  });
  h += segView("noteView", state.noteView);
  h += '<div class="filters" role="group" aria-label="Lọc theo người">' +
    '<button class="pill" data-act="who" data-id="all" aria-pressed="' + (L.who === "all") + '">Tất cả</button>' +
    L.members.map(function(m){
      return '<button class="pill" data-act="who" data-id="' + esc(m.id) + '" aria-pressed="' + (L.who === m.id) + '">' + pdot(m.name) + esc(m.name) + '</button>';
    }).join("") + '</div>';

  if(L.who !== "all"){
    var joined = L.items.filter(function(it){ return it.participants.indexOf(L.who) >= 0; });
    var mine = joined.reduce(function(a, it){ return a + shareOf(it); }, 0);
    var paid = L.items.filter(function(it){ return it.payer === L.who && it.amount; })
                      .reduce(function(a, it){ return a + it.amount; }, 0);
    h += '<div class="diff"><span><b>' + esc(memberName(L.who)) + '</b> tham gia ' + joined.length + ' note · phần mình ' +
      esc(vnd(mine)) + ' · đã trả ' + esc(vnd(paid)) + '</span></div>';
  }else{
    h += '<div class="diff"><span>' + L.items.length + ' note · đã ghi ' +
      esc(vnd(L.items.reduce(function(a, it){ return a + (it.amount || 0); }, 0))) + '</span></div>';
  }

  if(state.noteView === "cal") h += noteCalendar(list);
  else if(!list.length) h += '<div class="empty">' + (L.items.length ? "Người này chưa có note nào." : "Chưa có note nào.") + '</div>';
  else h += noteDays(list);

  /* quản lý người */
  h += '<div class="card"><div class="ttl"><h2>Người trong nhà</h2><em>' + L.members.length + ' người</em></div><div class="rows">' +
    L.members.map(function(m){
      var armed = L.delArm === "m:" + m.id;
      return '<div class="row"><div class="main"><div class="nm">' + pdot(m.name) + esc(m.name) + '</div></div>' +
        '<button class="lnk warn" data-act="delMember" data-id="' + esc(m.id) + '">' + (armed ? "Bấm lần nữa để xoá" : "Xoá") + '</button></div>';
    }).join("") + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="lfMember" placeholder="Thêm người" style="flex:1">' +
    '<button class="btn" data-act="addMember"' + (L.busy ? " disabled" : "") + '>Thêm</button></div>' +
    (L.memberMsg ? '<div class="ferr">' + esc(L.memberMsg) + '</div>' : "") + '</div>';

  return h + '</div>';
}

function wireItems(){
  var root = document.getElementById("ledger");
  if(!root) return;
  root.addEventListener("click", function(e){
    var sv = e.target.closest("#noteView button");
    if(sv){
      syncForm();
      if(sv.dataset.v !== state.noteView){ state.noteView = sv.dataset.v; save(); render(); }
      return;
    }
    var b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    var act = b.dataset.act, id = b.dataset.id;
    syncForm();
    if(act === "cday"){ L.day = b.dataset.d; return render(); }
    if(act === "mprev" || act === "mnext"){
      var yy = +L.month.slice(0, 4), mm = +L.month.slice(5, 7) - 1 + (act === "mnext" ? 1 : -1);
      var nd = new Date(yy, mm, 1);
      L.month = nd.getFullYear() + "-" + pad(nd.getMonth() + 1);
      return render();
    }
    if(act !== "del" && act !== "delMember") L.delArm = "";
    if(act === "retry") return ledgerLoad();
    if(act === "token"){
      var t = (document.getElementById("lfToken") || {}).value || "";
      if(!t.trim()) return;
      tokenSet(t.trim()); L.msg = ""; return ledgerLoad();
    }
    if(act === "seed") return addMembers(sheetNames());
    if(act === "addMember"){
      var inp = document.getElementById("lfMember");
      if(inp && inp.value.trim()) addMembers([inp.value]);
      return;
    }
    if(act === "delMember") return deleteMember(id);
    if(act === "quick"){ L.form.title = b.dataset.v; L.err = ""; render(); var t2 = document.getElementById("lfTitle"); if(t2) t2.focus(); return; }
    if(act === "toggle"){ L.form.participants[id] = !L.form.participants[id]; L.err = ""; return render(); }
    if(act === "all"){ L.members.forEach(function(m){ L.form.participants[m.id] = true; }); return render(); }
    if(act === "none"){ L.form.participants = {}; return render(); }
    if(act === "save") return saveItem();
    if(act === "cancel"){ L.form = blankForm(); L.err = ""; return render(); }
    if(act === "edit"){
      var it = L.items.filter(function(x){ return x.id === id; })[0];
      if(it){ L.form = formFrom(it); L.err = ""; render(); window.scrollTo(0, 0); }
      return;
    }
    if(act === "del") return deleteItem(id);
    if(act === "who"){ L.who = id; return render(); }
  });
  var amt = document.getElementById("lfAmount");
  if(amt) amt.addEventListener("input", function(){
    var raw = amt.value.replace(/[^\d]/g, "");
    if(raw !== amt.value) amt.value = raw;
    L.form.amount = raw;
    var hint = document.getElementById("lfHint"); if(hint) hint.textContent = formHint();
  });
  ["lfMember", "lfToken"].forEach(function(fid){
    var el = document.getElementById(fid);
    if(el) el.addEventListener("keydown", function(e){
      if(e.key !== "Enter") return;
      e.preventDefault();
      var btn = root.querySelector('[data-act="' + (fid === "lfMember" ? "addMember" : "token") + '"]');
      if(btn) btn.click();
    });
  });
}

function render(){
  document.getElementById("shName").textContent = state.current;
  document.getElementById("shMeta").textContent = state.loading ? "đang đọc…"
    : state.source === "live" && state.fetchedAt ? "cập nhật " + hhmm(state.fetchedAt)
    : state.source === "snapshot" ? "bản sao " + SNAP_TAKEN : "Chi Phí Nhà Hàng Tháng";
  var chip = document.getElementById("srcChip");
  chip.className = "src" + (state.source === "live" ? " live" : "");
  chip.innerHTML = "<i></i>" + (state.loading ? "đang nối" : state.source === "live" ? "Trực tiếp" : "Bản sao");
  document.getElementById("btnReload").classList.toggle("spin", state.loading);
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.setAttribute("aria-selected", String(t.dataset.tab === state.tab));
  });
  document.getElementById("btnAdv").setAttribute("aria-pressed", String(state.tab === "sheets"));

  var html;
  if(state.tab === "sheets") html = viewSheets();
  else if(state.tab === "items") html = viewItems();
  else if(state.loading && !state.data) html = skeleton();
  else if(state.error) html = '<div class="err">' + esc(state.error) + '</div><div class="btnrow" style="margin-top:12px"><button class="btn pri" id="retry">Thử lại</button></div>';
  else if(!state.data) html = '<div class="empty">Chưa có dữ liệu.</div>';
  else if(state.data.kind === "unknown") html = '<div class="err">Không nhận ra cấu trúc tab “' + esc(state.current) +
    '”. App đọc được hai kiểu bảng: bảng mua hàng (có cột “Người mua”) và bảng chi phí nhà (có cột “Danh mục”).</div>';
  else if(state.tab === "overview") html = viewOverview();
  else if(state.tab === "list") html = viewList();
  else if(state.tab === "pay") html = viewPay();
  else html = viewStats();

  document.getElementById("view").innerHTML = "<section>" + html + "</section>";
  wire();
}

function wire(){
  var q = document.getElementById("q");
  if(q) q.addEventListener("input", function(){
    var pos = q.selectionStart; state.q = q.value; render();
    var q2 = document.getElementById("q");
    if(q2){ q2.focus(); try{ q2.setSelectionRange(pos, pos); }catch(e){} }
  });
  [["fBuyer","filterBuyer"], ["fDay","filterDay"]].forEach(function(p){
    var box = document.getElementById(p[0]); if(!box) return;
    box.addEventListener("click", function(e){
      var b = e.target.closest(".pill"); if(!b) return;
      state[p[1]] = b.dataset.v; render();
    });
  });
  var pv = document.getElementById("payView");
  if(pv) pv.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || b.dataset.v === state.payView) return;
    state.payView = b.dataset.v; save(); render();
  });
  var pc = document.getElementById("paycal");
  if(pc) pc.addEventListener("click", function(e){
    var c = e.target.closest("[data-day]"); if(!c) return;
    state.payDay = c.dataset.day; render();
  });
  var fp = document.getElementById("fPay");
  if(fp) fp.addEventListener("click", function(e){
    var b = e.target.closest(".pill"); if(!b || b.dataset.v === state.payWho) return;
    state.payWho = b.dataset.v; save(); render();
  });
  var fm = document.getElementById("fMode");
  if(fm) fm.addEventListener("click", function(e){
    var b = e.target.closest(".pill"); if(!b || b.dataset.v === state.mode) return;
    state.mode = b.dataset.v; save(); reload();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(o){
    function pick(e){
      if(e.target.dataset && e.target.dataset.del){
        var nm = e.target.dataset.del;
        state.sheets = state.sheets.filter(function(s){ return s !== nm; });
        if(state.current === nm){ state.current = state.sheets[0]; save(); reload(); return; }
        save(); render(); return;
      }
      if(state.current === o.dataset.sheet) return;
      state.current = o.dataset.sheet; save(); leaveAdvanced(); reload();
    }
    o.addEventListener("click", pick);
    o.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(e); } });
  });
  var add = document.getElementById("addSheet");
  if(add) add.addEventListener("click", function(){
    var inp = document.getElementById("newSheet"), nm = (inp.value || "").trim();
    if(!nm) return;
    if(state.sheets.indexOf(nm) >= 0){ state.msg = "Tab “" + nm + "” đã có trong danh sách."; render(); return; }
    if(state.mode === "snapshot"){ state.msg = "Đang ở chế độ chỉ bản sao, không kiểm tra được tab mới."; render(); return; }
    add.disabled = true; add.textContent = "Đang kiểm tra…";
    gviz(nm, 10000).then(function(res){
      if(res && res.status !== "error"){
        state.sheets.push(nm); state.current = nm; save(); leaveAdvanced(); reload();
      }else{
        state.msg = "Không có tab tên “" + nm + "” trong Google Sheet."; render();
      }
    }).catch(function(){
      state.msg = "Không gọi được Google Sheet từ môi trường này, nên chưa kiểm tra được tên tab."; render();
    });
  });
  var sc = document.getElementById("scanBtn"); if(sc) sc.addEventListener("click", scan);
  var rb = document.getElementById("reloadBtn"); if(rb) rb.addEventListener("click", reload);
  var rt = document.getElementById("retry"); if(rt) rt.addEventListener("click", reload);
  var ab = document.getElementById("advBack"); if(ab) ab.addEventListener("click", function(){ leaveAdvanced(); });
  wireItems();
}

Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
  t.addEventListener("click", function(){
    syncForm();
    state.tab = t.dataset.tab;
    if(state.tab !== "sheets") state.msg = "";
    window.scrollTo(0, 0); render();
    if(state.tab === "items" && (L.status === "idle" || L.status === "error" || L.status === "no_db")) ledgerLoad();
  });
});
document.getElementById("btnReload").addEventListener("click", function(){
  if(state.tab === "items") ledgerLoad(); else reload();
});
/* Trang Nâng cao (chọn tab sheet, nguồn dữ liệu) không nằm trên thanh menu */
function openAdvanced(){
  syncForm();
  if(state.tab === "sheets"){ leaveAdvanced(); return; }
  state.prevTab = state.tab;
  state.tab = "sheets";
  window.scrollTo(0, 0); render();
}
function leaveAdvanced(to){
  state.tab = to || state.prevTab || "overview";
  state.msg = "";
  window.scrollTo(0, 0); render();
  if(state.tab === "items" && (L.status === "idle" || L.status === "error" || L.status === "no_db")) ledgerLoad();
}
document.getElementById("btnAdv").addEventListener("click", openAdvanced);
document.getElementById("brandBtn").addEventListener("click", openAdvanced);
document.getElementById("btnTheme").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next); save();
});
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && state.source === "live" && state.fetchedAt && Date.now() - state.fetchedAt.getTime() > 45000) reload();
});

load();
if(state.sheets.indexOf(state.current) < 0) state.current = state.sheets[0];
render();
reload();
})();
</script>
